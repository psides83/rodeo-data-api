name = "rodeo-data-api"
main = "src/index.ts"
compatibility_date = "2026-05-13"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
CACHE_TTL_SECONDS = "300"
CACHE_VERSION = "2026-08-01-1"
RODEOS_CACHE_TTL_SECONDS = "1800"
MONTHLY_MONEY_CACHE_TTL_SECONDS = "3600"
MONTHLY_MONEY_REFRESH_EVENTS = "BB,SB,BR,TD,SW,TR,HD,HL,SR,GB,LB"
MONTHLY_MONEY_RODEO_LIMIT = "5"
MONTHLY_MONEY_BACKFILL_RODEO_LIMIT = "5"
MONTHLY_MONEY_REQUEST_DELAY_MS = "1500"
SCHEMA_CACHE_TTL_SECONDS = "3600"
CACHE_STALE_WHILE_REVALIDATE_SECONDS = "600"

[triggers]
crons = ["0 13 * * 1"]
